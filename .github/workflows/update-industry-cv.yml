name: Update published industry CV dates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-industry-cv.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Intuos dates in both PDF copies
        run: |
          python -m pip install --quiet pymupdf
          python - <<'PY'
          import fitz
          from pathlib import Path
          paths = [Path("cv.pdf"), Path("downloads/Adebanji_Adelowo_CV_ML_Data_Science.pdf")]
          for path in paths:
              doc = fitz.open(path)
              page = doc[0]
              dates = page.search_for("Dec 2024")
              assert len(dates)==1, (path,"Expected Intuos start date",dates)
              start_rect=dates[0]
              candidates=page.search_for("Present")
              matches=[r for r in candidates if abs(r.x0-start_rect.x0)<20 and 0 <= r.y0-start_rect.y0 < 40]
              assert len(matches)==1, (path,"Expected Intuos end date",matches)
              rect=matches[0]
              page.add_redact_annot(rect,fill=(1,1,1))
              page.apply_redactions(images=0,graphics=0,text=0)
              page.insert_text((rect.x0,rect.y1-2),"Dec 2026",fontname="helv",fontsize=9,color=(0,0,0),overlay=True)
              doc.save(str(path)+".tmp",garbage=4,deflate=True)
              doc.close()
              Path(str(path)+".tmp").replace(path)
              verify=fitz.open(path)
              txt=verify[0].get_text()
              assert "Dec 2026" in txt and "Dec 2024" in txt and "Intuos Srl" in txt
              print("Updated",path,"pages",len(verify))
              verify.close()
          assert paths[0].read_bytes()==paths[1].read_bytes(),"Industry copies differ"
          PY
      - name: Commit updated CV PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv.pdf downloads/Adebanji_Adelowo_CV_ML_Data_Science.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Update Intuos dates in public industry CV PDFs"
            git pull --rebase origin main
            git push
          fi
